version: "3.8"

services:
  # Thùng 1: Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: student_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "@Nguyenxuan123" # Đặt mật khẩu bất kỳ cho docker
      MYSQL_DATABASE: "student_management"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Tự động chạy file tạo bảng nếu DB trống (Lát nữa mình sẽ làm bước này)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # Thùng 2: Backend Golang
  backend:
    build: ./backend
    container_name: student_backend_container
    restart: always
    # XÓA HOẶC ẨN DÒNG PORTS ĐI ĐỂ NGINX QUẢN LÝ
    # ports:
    #   - "8080:8080"
    environment:
      # Chỗ này cực kỳ quan trọng: Trong Docker, muốn gọi sang MySQL thì thay '127.0.0.1' bằng tên dịch vụ 'db'
      DB_DSN: "root:@Nguyenxuan123@tcp(db:3306)/student_management?parseTime=true"
    depends_on:
      - db

  # Thùng 3: Frontend React
  frontend:
    build: ./frontend
    container_name: student_frontend_container
    restart: always
    # XÓA HOẶC ẨN DÒNG PORTS ĐI ĐỂ NGINX QUẢN LÝ
    #ports:
    # - "5173:5173"
    depends_on:
      - backend

  # THÊM DỊCH VỤ NGINX VÀO ĐÂY
  nginx:
    image: nginx:alpine
    container_name: student_nginx_container
    restart: always
    ports:
      - "80:80" # Nginx đứng ở cổng 80 đại diện cho cả hệ thống
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
